name: MOPS Scraper

on:
  schedule:
    - cron: "0 10 * * 1-5"   # UTC 10:00 = 台灣時間 18:00，週一到週五
  workflow_dispatch:          # 讓人可以在網頁上按鈕手動執行

permissions:
  contents: write             # 允許把 CSV commit 回 repo

jobs:
  run:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scraper
        run: |
          mkdir -p output
          python mops_scraper.py
        env:
          RUN_FOREVER: "0"
          OUTPUT_DIR: output

      - name: Upload CSV as artifact
        uses: actions/upload-artifact@v4
        with:
          name: mops-csv
          path: output/*.csv
          if-no-files-found: warn

      - name: Commit CSV to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/
          if git diff --cached --quiet; then
            echo "沒有新檔案需要 commit"
          else
            git commit -m "chore: add CSV $(date -u +%F_%H%M)"
            git push
          fi
